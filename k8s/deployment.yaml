apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-flask-app
  labels:
    app: secure-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-flask-app
  template:
    metadata:
      labels:
        app: secure-flask-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER   # replaced by Jenkins at deploy time
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp      # gunicorn needs a writable /tmp
      volumes:
        - name: tmp
          emptyDir: {}
